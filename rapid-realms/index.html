<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rapid Realms</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0d0f1a; }
      body { display: flex; align-items: center; justify-content: center; touch-action: none; -webkit-user-select: none; user-select: none; }
      #unity-canvas { display: block; background: #0d0f1a; outline: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
                 color: #e6eaf0; font: italic 18px Georgia, "Times New Roman", serif; letter-spacing: .04em; pointer-events: none; }
      #loading .title { font: bold 26px Georgia, "Times New Roman", serif; letter-spacing: .18em; font-style: normal; }
      #bar { width: 220px; height: 3px; background: rgba(169, 184, 195, .25); border-radius: 2px; overflow: hidden; }
      #fill { width: 0; height: 100%; background: #e8be62; transition: width .2s; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading"><div class="title">RAPID REALMS</div><div id="bar"><div id="fill"></div></div><div>Descending…</div></div>
    <script src="Build/WebGL.loader.js"></script>
    <script>
      // The game is portrait (390 × 844). Fit it to the window without stretching; a phone fills the screen.
      var canvas = document.querySelector("#unity-canvas");
      var aspect = 390 / 844;
      function fit() {
        var w = window.innerWidth, h = window.innerHeight;
        var phone = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        if (phone) { canvas.style.width = w + "px"; canvas.style.height = h + "px"; return; }
        if (w / h > aspect) { canvas.style.height = h + "px"; canvas.style.width = Math.round(h * aspect) + "px"; }
        else { canvas.style.width = w + "px"; canvas.style.height = Math.round(w / aspect) + "px"; }
      }
      window.addEventListener("resize", fit);
      fit();
      canvas.focus();

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/WebGL.data.unityweb",
        frameworkUrl: "Build/WebGL.framework.js.unityweb",
        codeUrl: "Build/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Rapid Realms",
        productName: "Rapid Realms",
        productVersion: "1.2",
      }, function (progress) {
        document.getElementById("fill").style.width = Math.round(progress * 100) + "%";
      }).then(function () {
        document.getElementById("loading").remove();
        canvas.focus();
      }).catch(function (message) {
        document.getElementById("loading").textContent = message;
      });
    </script>
  </body>
</html>
